name: Telegram Bot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group build --group test

      - name: Install Bengali PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-core

      - name: Run full pytest suite
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  quality:
    name: Static analysis and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --locked --python 3.13 --group build --group test

      - name: Ruff
        run: |
          python -m pip install ruff==0.17.1
          ruff check --select E4,E7,E9,F src tests

      - name: Python compile checks
        run: python -m compileall -q src tests scripts

      - name: JavaScript syntax check
        run: node --check src/enan_ultra/webapp/static/app.js

      - name: JavaScript tests
        run: node --test tests/test_webapp_theme_ui.cjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Verify committed requirements export
        run: |
          uv export --locked --format requirements.txt --no-dev --group build --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Audit committed requirements export
        run: uvx --from pip-audit==2.10.1 pip-audit --no-deps --requirement requirements.txt

      - name: Audit locked dependencies
        run: |
          uv export --locked --no-default-groups --group build --group test --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --requirement "$RUNNER_TEMP/requirements-audit.txt"

  build:
    name: Wheel build and Mini App assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build wheel
        run: uv build --wheel --no-sources

      - name: Verify packaged Mini App assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {len(wheels)}"
          required = {
              "enan_ultra/webapp/static/index.html",
              "enan_ultra/webapp/static/app.js",
              "enan_ultra/webapp/static/app.css",
          }
          required.update(
              f"enan_ultra/webapp/themes/{path.name}"
              for path in Path("src/enan_ultra/webapp/themes").glob("*.json")
          )
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          missing = sorted(required - packaged)
          assert not missing, f"Wheel is missing web assets: {missing}"
          print(f"wheel={wheels[0]} files={len(packaged)}")
          PY

      - name: Install wheel and import the package
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import enan_ultra; print('import ok')"

  config-validation:
    name: Configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies and YAML parser
        run: |
          uv sync --locked --python 3.13 --group build --group test
          python -m pip install pyyaml==6.0.3

      - name: Validate Settings documentation and behavior
        run: uv run --locked --python 3.13 python scripts/validate_config.py

      - name: Validate workflow YAML and repository JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          failures = []
          workflow_paths = sorted(Path(".github/workflows").glob("*.yml"))
          for path in workflow_paths:
              try:
                  document = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: {exc}")
                  continue
              if not isinstance(document, dict) or "jobs" not in document:
                  failures.append(f"{path}: missing jobs")
                  continue
              if not isinstance(document["jobs"], dict) or not document["jobs"]:
                  failures.append(f"{path}: jobs must be a non-empty mapping")
                  continue
              for job_name, job in document["jobs"].items():
                  if not isinstance(job, dict) or not (
                      "runs-on" in job or "uses" in job
                  ):
                      failures.append(f"{path}: job {job_name} has no runs-on/uses")
          dependabot = Path(".github/dependabot.yml")
          if dependabot.exists():
              try:
                  document = yaml.safe_load(dependabot.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"{dependabot}: {exc}")
              else:
                  if not isinstance(document, dict) or document.get("version") != 2:
                      failures.append(f"{dependabot}: expected Dependabot version 2")
                  if not isinstance(document.get("updates"), list):
                      failures.append(f"{dependabot}: missing updates list")
          for path in sorted(Path(".github").rglob("*.json")):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("workflow and JSON configuration valid")
          PY
